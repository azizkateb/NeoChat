kind = "web"
previewPath = "/"
title = "NeoChat AI Messenger"
version = "1.0.0"
id = "artifacts/ai-messenger"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23501

[services.development]
run = "pnpm --filter @workspace/ai-messenger run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-messenger", "run", "build" ]
publicDir = "artifacts/ai-messenger/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23501"
BASE_PATH = "/"
